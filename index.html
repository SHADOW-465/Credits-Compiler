<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Credits Compiler</title>
    <meta name="description" content="Turn a photo-log spreadsheet into a submission-ready credit page." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231E242B'/%3E%3Cpath d='M8 17.5 13 22.5 24.5 10' fill='none' stroke='%232D6CB5' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      THESIS: A credit page is proofread, not exported. This tool puts the finished
      page on screen while the columns are still being mapped, and refuses the
      upload-configure-download wizard that hides the result until the end.
      OWN-WORLD: A proofing desk. Dark ink blotter rail (#1E242B) carrying the
      working controls against a warm grey desk (#C9C6BC) with one white sheet of
      paper floating on it. Proof-marker semantics: editor's blue for action and
      selection, proof red for blocking, green for resolved, amber for a query.
      Archivo for the tool, Literata for the page, because the page is print.
      STORY: A media researcher drops the photo log, sees the credit page appear
      correctly alphabetised, works the query list down to nothing, exports .docx.
      FIRST VIEWPORT: Full-height split. Left 27rem blotter: file, sheet, four
      mapping slots showing live sample values, prompt field, query list. Right:
      the sheet of paper, headed "Photo credits", carrying the mandatory sentence
      and the compiled credits. Primary action (Export .docx) sits top right on
      the bar, next to the style toggle. Before a file exists the sheet shows the
      guidelines' own worked example, so the empty state teaches the format.
      FORM: Two-panel proofing desk, first on the ordered list. Code-led build,
      no comp round; seed: none.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying
      its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
